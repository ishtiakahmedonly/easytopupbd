<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EASY TOP UP Admin</title>
<style>
body{margin:0;background:#f5f8f5;font-family:Arial,sans-serif;color:#17251b}
header{background:#153d25;color:white;padding:20px;font-size:22px;font-weight:bold}
main{max-width:850px;margin:25px auto;padding:15px}
.box{background:white;padding:20px;border-radius:12px;margin-bottom:18px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:7px;box-sizing:border-box}
button{background:#16a34a;color:white;border:0;padding:11px 16px;border-radius:7px;font-weight:bold;cursor:pointer}
.product{border:1px solid #e5ebe6;padding:14px;border-radius:10px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row input{flex:1;min-width:100px}
.small{font-size:13px;color:#64746a}
#message{margin-top:12px;color:#16833c}
</style>
</head>
<body>

<header>EASY TOP UP — Admin Panel</header>

<main>
<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div class="box" id="dashboard" hidden>
<div class="row">
<h2>Products</h2>
<button id="logoutBtn">Logout</button>
</div>
<p class="small">এখানে প্যাকেজের দাম ও Active Status পরিবর্তন করতে পারবে।</p>
<div id="products">Loading...</div>
</div>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
 getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
 getFirestore, collection, getDocs, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

// নিজের Firebase Web App-এর config এখানে বসাবে।
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCB8oFTudGGag2Va4h9sRHMl5-Vl_gxd4E",
  authDomain: "easytopupbdonline.firebaseapp.com",
  projectId: "easytopupbdonline",
  storageBucket: "easytopupbdonline.firebasestorage.app",
  messagingSenderId: "28816531759",
  appId: "1:28816531759:web:e7ec4a07842800189a41da",
  measurementId: "G-05ETJP4NQ5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const productsDiv = document.getElementById("products");

document.getElementById("loginBtn").onclick = async () => {
 try {
  await signInWithEmailAndPassword(
   auth,
   document.getElementById("email").value,
   document.getElementById("password").value
  );
  message.textContent = "Login successful";
 } catch(error) {
  message.textContent = "Login হয়নি। Email ও Password যাচাই করো।";
 }
};

onAuthStateChanged(auth, async user => {
 if(user) {
  loginBox.hidden = true;
  dashboard.hidden = false;
  await loadProducts();
 } else {
  loginBox.hidden = false;
  dashboard.hidden = true;
 }
});

async function loadProducts() {
 productsDiv.textContent = "Loading...";
 try {
  const snapshot = await getDocs(collection(db,"products"));
  productsDiv.innerHTML = "";

  snapshot.forEach(item => {
   const data = item.data();
   const card = document.createElement("div");
   card.className = "product";

   const title = document.createElement("h3");
   title.textContent = data.name || item.id;

   const price = document.createElement("input");
   price.type = "number";
   price.min = "0";
   price.value = data.price ?? 0;

   const status = document.createElement("label");
   const active = document.createElement("input");
   active.type = "checkbox";
   active.checked = data.active === true;
   active.style.width = "auto";
   status.append(active, " Active");

   const save = document.createElement("button");
   save.textContent = "Save Changes";

   save.onclick = async () => {
    const newPrice = Number(price.value);
    if(!Number.isInteger(newPrice) || newPrice < 0) {
     alert("সঠিক দাম লিখো");
     return;
    }
    try {
     await updateDoc(doc(db,"products",item.id), {
      price: newPrice,
      active: active.checked
     });
     alert("পরিবর্তন Save হয়েছে");
    } catch(error) {
     alert("Save হয়নি। Rules ও Admin UID যাচাই করতে হবে।");
    }
   };

   card.append(title, price, status, save);
   productsDiv.appendChild(card);
  });

 } catch(error) {
  productsDiv.textContent = "Products লোড হয়নি। Firebase Config ও Rules যাচাই করো।";
 }
}

document.getElementById("logoutBtn").onclick = () => signOut(auth);
</script>
</body>
</html>
